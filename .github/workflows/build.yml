name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: peterrietzler/taxi-rides-outlier-detection
  IMAGE_VERSION: 1.1.0

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.13-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install -e .
          pip install .[test]

      - name: Check code style
        run: |
          ruff check taxi_rides_outlier_detection tests
      - name: Run tests
        run: |
          pytest
  
  train-random-forest-classifier:
    runs-on: ubuntu-latest
    needs: test
    container:
      image: python:3.13-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install training code
        run: |
          pip install -e .
      - name: Train Random Forest Classifier 
        run: |
          train-random-forest-classifier data/labeled/taxi-rides.parquet random-forest-model
          echo '### Random Forest Classifier' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat random-forest-model.metadata.json >> $GITHUB_STEP_SUMMARY
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: random-forest-model
          path: |
            random-forest-model
            random-forest-model.metadata.json

  train-random-forest-classifier-v2:
    runs-on: ubuntu-latest
    needs: test
    container:
      image: python:3.13-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install training code
        run: |
          pip install -e .
      - name: Train Random Forest Classifier V2
        run: |
          train-random-forest-classifier-v2 data/labeled/taxi-rides.parquet random-forest-model-v2
          echo '### Random Forest Classifier V2' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat random-forest-model-v2.metadata.json >> $GITHUB_STEP_SUMMARY
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: random-forest-model-v2
          path: |
            random-forest-model-v2
            random-forest-model-v2.metadata.json

  train-logistic-regression-classifier:
    runs-on: ubuntu-latest
    needs: test
    container:
      image: python:3.13-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install training code
        run: |
          pip install -e .
      - name: Train Logistic Regression Classifier
        run: |
          train-logistic-regression-classifier data/labeled/taxi-rides.parquet logistic-regression-model
          echo '### Logistic Regression Classifier' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat logistic-regression-model.metadata.json >> $GITHUB_STEP_SUMMARY
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logistic-regression-model
          path: |
            logistic-regression-model
            logistic-regression-model.metadata.json


  select-best-model:
    runs-on: ubuntu-latest
    needs: [train-random-forest-classifier, train-random-forest-classifier-v2, train-logistic-regression-classifier]
    container:
      image: python:3.13-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download model artifacs
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: .
      - name: Select best model by f1-score
        run: |
          sh select-best-model.sh random-forest-model.metadata.json random-forest-model-v2.metadata.json logistic-regression-model.metadata.json

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model

  build-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: select-best-model
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: model

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}