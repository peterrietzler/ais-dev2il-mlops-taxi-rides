name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: peterrietzler/taxi-rides-outlier-detection
  IMAGE_VERSION: 1.1.0

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.13-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install -e .
          pip install .[test]

      - name: Check code style
        run: |
          ruff check taxi_rides_outlier_detection tests
      - name: Run tests
        run: |
          pytest
  
  train-model:
    runs-on: ubuntu-latest
    needs: test
    container:
      image: python:3.13-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install training code
        run: |
          pip install -e .
      - name: Train Model 
        run: |
          train-random-forest-classifier data/labeled/taxi-rides.parquet model
          cat model.metadata.json' >> $GITHUB_STEP_SUMMARY
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model

  build-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: train-model
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: model

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}